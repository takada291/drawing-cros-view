<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>横断面図</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { background-color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; margin: 0; user-select: none; }
        /* A4横の比率 (297:210) = 1122px : 793px */
        #canvas-container { 
            background: white; 
            aspect-ratio: 297 / 210; 
            width: 100%; 
            max-width: 1122px; 
            margin: 0 auto;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: crosshair;
            overflow: hidden;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .toolbar { background: #1f2937; color: white; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; z-index: 20;}
        .btn { padding: 5px 15px; border-radius: 4px; background: #374151; cursor: pointer; border: 1px solid #4b5563; font-size: 14px;}
        .btn:hover { background: #4b5563; }
        .btn.active { background: #3b82f6; border-color: #2563eb; }
        input[type="number"], select { color: black !important; padding: 4px; border-radius: 4px; }
        select option { color: black; background: white; }
        #info-bar { background: #e5e7eb; padding: 5px 10px; font-size: 14px; text-align: center; font-weight: bold; color: #111827; }
        
        /* 凡例テーブル */
        .legend-table th { background: #f3f4f6; border: 1px solid #000; padding: 2px 4px; font-weight: normal; font-size: 12px; width: 60px;}
        .legend-table td { border: 1px solid #000; padding: 0; }
        .legend-table input { width: 100%; height: 100%; border: none; outline: none; text-align: center; font-size: 12px; background: transparent; color: black; }
    </style>
</head>
<body>

    <!-- 上部メニュー -->
    <div class="toolbar">
        <h1 class="text-xl font-bold mr-4">横断面図v0.5 <span class="text-sm font-normal">(A4横)</span></h1>
        <label>縮尺 1/</label>
        <input type="number" id="scale-input" value="100" class="w-20" onchange="updateScale()">
        
        <button class="btn ml-4" onclick="undo()">↶ UNDO(戻る)</button>
        <button class="btn bg-red-600 hover:bg-red-700 ml-2" onclick="clearCanvas()">全消去</button>
        
        <div class="flex-grow"></div>

        <button class="btn" onclick="exportPDF()">PDF出力</button>
        <button class="btn" onclick="exportDXF()">DXF保存</button>
        <input type="file" id="dxf-import" accept=".dxf" style="display: none;" onchange="importDXF(event)">
        <button class="btn" onclick="document.getElementById('dxf-import').click()">DXF読込</button>
    </div>

    <!-- キャンバスエリア -->
    <div class="flex-grow overflow-auto p-4 flex justify-center items-center" id="main-area">
        <div id="canvas-container">
            <canvas id="gridLayer"></canvas>
            <canvas id="drawingLayer"></canvas>
            <canvas id="uiLayer"></canvas>

            <!-- 右下凡例とスケールバー -->
            <div id="legend-box" class="absolute bottom-4 right-4 bg-white border-2 border-black p-2 z-10 flex flex-col" style="width: 220px;">
                <table class="legend-table w-full border-collapse text-center mb-2">
                    <tr><th>路線名</th><td><input type="text" value="作業道 〇〇線"></td></tr>
                    <tr><th>施工箇所</th><td><input type="text" value="〇〇市〇〇町 地内"></td></tr>
                    <tr><th>測点</th><td><input type="text" value="NO.0"></td></tr>
                    <tr><th>縮尺</th><td id="legend-scale-text" class="text-xs font-bold py-1">S = 1/100</td></tr>
                </table>
                <!-- スケールバー -->
                <div class="flex flex-col items-center">
                    <div id="scale-bar-text" class="text-xs leading-none">1m</div>
                    <div id="scale-bar-line" class="border-b-2 border-l-2 border-black border-r-2 mt-1" style="height: 6px; width: 37.77px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 情報表示バー -->
    <div id="info-bar">描画モードを選択してください（Shiftキーを押しながら描画で水平・垂直になります）</div>

    <!-- 下部描画ツール -->
    <div class="toolbar">
        <button class="btn active" id="mode-select" onclick="setMode('select')">選択/移動</button>
        <button class="btn hover:bg-red-500" id="mode-delete" onclick="setMode('delete')">要素削除</button>
        <span class="border-l border-gray-500 h-6 mx-1"></span>
        <button class="btn" id="mode-solid" onclick="setMode('solid')">実線</button>
        <button class="btn" id="mode-dashed" onclick="setMode('dashed')">破線</button>
        <button class="btn" id="mode-text" onclick="setMode('text')">テキスト挿入</button>
        <button class="btn" id="mode-measure" onclick="setMode('measure')">距離計測</button>
        <button class="btn" id="mode-area" onclick="setMode('area')">面積計測</button>
        
        <label class="ml-4">勾配指定:</label>
        <select id="slope-select" onchange="updateSlope()">
            <option value="free">自由</option>
            <option value="0.3">3分 (1:0.3)</option>
            <option value="0.5">5分 (1:0.5)</option>
            <option value="0.6">6分 (1:0.6)</option>
            <option value="1.0">1割 (1:1.0)</option>
            <option value="1.2">1割2分 (1:1.2)</option>
            <option value="1.5">1割5分 (1:1.5)</option>
        </select>
        
        <label class="ml-4"><input type="checkbox" id="snap-toggle" checked> スナップ(端点)</label>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const drawCanvas = document.getElementById('drawingLayer');
        const uiCanvas = document.getElementById('uiLayer');
        const drawCtx = drawCanvas.getContext('2d');
        const uiCtx = uiCanvas.getContext('2d');
        const infoBar = document.getElementById('info-bar');

        const CANVAS_WIDTH = 1122;
        const CANVAS_HEIGHT = 793;
        const PIXELS_PER_MM = CANVAS_WIDTH / 297; 

        let lines = [];
        let texts = []; 
        let history = []; 
        
        let currentMode = 'select'; 
        let isDrawing = false;
        let startPoint = null;
        let scale = 100;
        let selectedSlope = 'free';
        let snappedPoint = null;
        
        let areaPoints = []; 

        // テキスト移動・削除用変数
        let draggingTextIndex = -1;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let hoveredDeleteElement = null; // 削除モード時のハイライト対象

        function saveState() {
            history.push(JSON.stringify({ lines, texts }));
            if (history.length > 30) history.shift(); 
        }

        function undo() {
            if (history.length > 0) {
                const state = JSON.parse(history.pop());
                lines = state.lines;
                texts = state.texts;
                redrawAll();
                infoBar.innerText = "1つ前の状態に戻しました";
            } else {
                infoBar.innerText = "これ以上戻せません";
            }
        }

        function resizeCanvases() {
            [drawCanvas, uiCanvas, document.getElementById('gridLayer')].forEach(c => {
                c.width = CANVAS_WIDTH;
                c.height = CANVAS_HEIGHT;
            });
            redrawAll();
            updateScaleBar();
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.toolbar .btn').forEach(b => b.classList.remove('active'));
            document.getElementById('mode-' + mode).classList.add('active');
            
            areaPoints = []; 
            draggingTextIndex = -1;
            hoveredDeleteElement = null;
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
            container.style.cursor = (mode === 'delete' || mode === 'select') ? 'default' : 'crosshair';
            
            const msgs = {
                'solid': '始点から終点へドラッグ（Shiftキーで水平/垂直）',
                'dashed': '始点から終点へドラッグ（Shiftキーで水平/垂直）',
                'measure': '始点から終点へドラッグして距離を計測',
                'area': '頂点を順番にクリックし、右クリックで面積計算結果を下部に表示',
                'text': 'キャンバス上の配置したい場所をクリックしてテキストを挿入',
                'select': 'テキストをドラッグで移動できます',
                'delete': '削除したい線分やテキストをクリックしてください（赤くハイライトされます）'
            };
            infoBar.innerText = msgs[mode] || "";
        }

        function updateScale() {
            scale = parseFloat(document.getElementById('scale-input').value) || 100;
            document.getElementById('legend-scale-text').innerText = `S = 1/${scale}`;
            updateScaleBar();
        }

        function updateScaleBar() {
            const realMeters = 1;
            const mmOnPaper = (realMeters * 1000) / scale;
            const pxWidth = mmOnPaper * PIXELS_PER_MM;
            document.getElementById('scale-bar-line').style.width = pxWidth + 'px';
            document.getElementById('scale-bar-text').innerText = `${realMeters}m`;
        }

        function updateSlope() {
            selectedSlope = document.getElementById('slope-select').value;
        }

        function clearCanvas() {
            if(confirm('全ての描画を消去しますか？')) {
                saveState();
                lines = [];
                texts = [];
                areaPoints = [];
                redrawAll();
            }
        }

        function getMousePos(e) {
            const rect = uiCanvas.getBoundingClientRect();
            const scaleX = uiCanvas.width / rect.width;
            const scaleY = uiCanvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function checkSnap(pos) {
            const snapDist = 20; 
            let closest = null;
            let minDist = snapDist;

            if (document.getElementById('snap-toggle').checked) {
                for (let line of lines) {
                    for (let pt of [line.start, line.end]) {
                        let d = Math.hypot(pt.x - pos.x, pt.y - pos.y);
                        if (d < minDist) {
                            minDist = d;
                            closest = { x: pt.x, y: pt.y };
                        }
                    }
                }
                for (let pt of areaPoints) {
                    let d = Math.hypot(pt.x - pos.x, pt.y - pos.y);
                    if (d < minDist) {
                        minDist = d;
                        closest = { x: pt.x, y: pt.y };
                    }
                }
            }
            return closest;
        }

        function applyConstraints(start, end, e) {
            let res = { x: end.x, y: end.y };
            if (e.shiftKey) {
                const dx = Math.abs(end.x - start.x);
                const dy = Math.abs(end.y - start.y);
                if (dx > dy) {
                    res.y = start.y;
                } else {
                    res.x = start.x;
                }
                return res;
            }

            if (selectedSlope !== 'free') {
                const H = parseFloat(selectedSlope);
                const dx = end.x - start.x;
                const dy = end.y - start.y;
                const signX = dx >= 0 ? 1 : -1;
                const newDx = Math.abs(dy) * H * signX;
                res = { x: start.x + newDx, y: end.y };
            }
            return res;
        }

        // 線分と点の距離を求める関数（削除対象の判定用）
        function distToSegment(p, v, w) {
            let l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
            if (l2 == 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        uiCanvas.addEventListener('mousedown', (e) => {
            if (e.button === 2) return; 
            const pos = getMousePos(e);
            
            // 要素削除の実行
            if (currentMode === 'delete' && hoveredDeleteElement) {
                saveState();
                if (hoveredDeleteElement.type === 'text') {
                    texts.splice(hoveredDeleteElement.index, 1);
                } else if (hoveredDeleteElement.type === 'line') {
                    lines.splice(hoveredDeleteElement.index, 1);
                }
                hoveredDeleteElement = null;
                redrawAll();
                uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
                return; 
            }

            const effectivePos = snappedPoint || pos;

            if (currentMode === 'select') {
                drawCtx.font = "16px sans-serif";
                for (let i = texts.length - 1; i >= 0; i--) {
                    let t = texts[i];
                    let width = drawCtx.measureText(t.text).width;
                    if (Math.abs(pos.x - t.x) <= width / 2 + 10 && Math.abs(pos.y - t.y) <= 12) {
                        saveState();
                        draggingTextIndex = i;
                        dragOffsetX = pos.x - t.x;
                        dragOffsetY = pos.y - t.y;
                        break;
                    }
                }
            } else if (currentMode === 'solid' || currentMode === 'dashed' || currentMode === 'measure') {
                isDrawing = true;
                startPoint = effectivePos;
            } else if (currentMode === 'text') {
                const t = prompt('挿入するテキストを入力してください（寸法など）:');
                if (t) {
                    saveState();
                    texts.push({ text: t, x: pos.x, y: pos.y });
                    redrawAll();
                }
            } else if (currentMode === 'area') {
                areaPoints.push(effectivePos);
                drawAreaPreview(pos);
            }
        });

        uiCanvas.addEventListener('mousemove', (e) => {
            const pos = getMousePos(e);
            snappedPoint = checkSnap(pos);
            const effectivePos = snappedPoint || pos;

            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

            // 要素削除モード時のハイライト判定
            if (currentMode === 'delete') {
                hoveredDeleteElement = null;
                let minDist = 15; // 判定の甘さ（ピクセル）
                
                // まずテキストを優先判定
                drawCtx.font = "16px sans-serif";
                for (let i = texts.length - 1; i >= 0; i--) {
                    let t = texts[i];
                    let width = drawCtx.measureText(t.text).width;
                    if (Math.abs(pos.x - t.x) <= width / 2 + 10 && Math.abs(pos.y - t.y) <= 12) {
                        hoveredDeleteElement = { type: 'text', index: i };
                        minDist = 0; 
                        break;
                    }
                }
                // 次に線分を判定
                if (!hoveredDeleteElement) {
                    for (let i = lines.length - 1; i >= 0; i--) {
                        let d = distToSegment(pos, lines[i].start, lines[i].end);
                        if (d < minDist) {
                            minDist = d;
                            hoveredDeleteElement = { type: 'line', index: i };
                        }
                    }
                }
                
                // ハイライトの描画
                if (hoveredDeleteElement) {
                    container.style.cursor = 'pointer';
                    if (hoveredDeleteElement.type === 'text') {
                        let t = texts[hoveredDeleteElement.index];
                        uiCtx.font = "16px sans-serif";
                        let w = uiCtx.measureText(t.text).width;
                        uiCtx.fillStyle = 'rgba(239, 68, 68, 0.3)'; // 薄い赤
                        uiCtx.fillRect(t.x - w/2 - 5, t.y - 12, w + 10, 24);
                    } else if (hoveredDeleteElement.type === 'line') {
                        let l = lines[hoveredDeleteElement.index];
                        uiCtx.beginPath();
                        uiCtx.moveTo(l.start.x, l.start.y);
                        uiCtx.lineTo(l.end.x, l.end.y);
                        uiCtx.strokeStyle = 'rgba(239, 68, 68, 0.5)'; // 半透明の赤太線
                        uiCtx.lineWidth = 6;
                        uiCtx.stroke();
                    }
                } else {
                    container.style.cursor = 'default';
                }
            }

            // テキスト移動処理
            if (currentMode === 'select') {
                if (draggingTextIndex !== -1) {
                    texts[draggingTextIndex].x = pos.x - dragOffsetX;
                    texts[draggingTextIndex].y = pos.y - dragOffsetY;
                    redrawAll();
                } else {
                    let hovered = false;
                    drawCtx.font = "16px sans-serif";
                    for (let t of texts) {
                        let width = drawCtx.measureText(t.text).width;
                        if (Math.abs(pos.x - t.x) <= width / 2 + 10 && Math.abs(pos.y - t.y) <= 12) {
                            hovered = true;
                            break;
                        }
                    }
                    container.style.cursor = hovered ? 'move' : 'default';
                }
            }

            // テキスト挿入時のガイドライン（十字線）
            if (currentMode === 'text') {
                uiCtx.beginPath();
                uiCtx.moveTo(0, pos.y);
                uiCtx.lineTo(uiCanvas.width, pos.y);
                uiCtx.moveTo(pos.x, 0);
                uiCtx.lineTo(pos.x, uiCanvas.height);
                uiCtx.strokeStyle = 'rgba(59, 130, 246, 0.4)'; 
                uiCtx.setLineDash([4, 4]);
                uiCtx.lineWidth = 1;
                uiCtx.stroke();
                uiCtx.setLineDash([]);
                
                uiCtx.font = "12px sans-serif";
                uiCtx.fillStyle = 'rgba(59, 130, 246, 0.8)';
                uiCtx.textAlign = "left";
                uiCtx.textBaseline = "bottom";
                uiCtx.fillText("テキスト配置", pos.x + 5, pos.y - 5);
            }

            if (snappedPoint && (currentMode === 'solid' || currentMode === 'dashed' || currentMode === 'measure' || currentMode === 'area')) {
                uiCtx.beginPath();
                uiCtx.arc(snappedPoint.x, snappedPoint.y, 6, 0, Math.PI * 2);
                uiCtx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                uiCtx.fill();
            }

            if (isDrawing && startPoint) {
                let endPos = snappedPoint ? snappedPoint : applyConstraints(startPoint, effectivePos, e);
                const distPix = Math.hypot(endPos.x - startPoint.x, endPos.y - startPoint.y);
                const distMeters = (distPix / PIXELS_PER_MM) * (scale / 1000);
                const midX = (startPoint.x + endPos.x) / 2;
                const midY = (startPoint.y + endPos.y) / 2;

                uiCtx.beginPath();
                uiCtx.moveTo(startPoint.x, startPoint.y);
                uiCtx.lineTo(endPos.x, endPos.y);
                
                if (currentMode === 'measure') {
                    uiCtx.setLineDash([5, 5]);
                    uiCtx.strokeStyle = '#3b82f6'; 
                    uiCtx.lineWidth = 1;
                    infoBar.innerText = `距離: ${distMeters.toFixed(2)} m`;
                    uiCtx.stroke();
                    
                    uiCtx.font = "14px sans-serif";
                    uiCtx.fillStyle = "#3b82f6";
                    uiCtx.textAlign = "center";
                    uiCtx.textBaseline = "bottom";
                    uiCtx.fillText(`${distMeters.toFixed(2)} m`, midX, midY - 5);

                } else {
                    uiCtx.setLineDash(currentMode === 'dashed' ? [10, 10] : []);
                    uiCtx.strokeStyle = '#ef4444'; 
                    uiCtx.lineWidth = 2;
                    uiCtx.stroke();
                    
                    if (distPix > 10) {
                        uiCtx.font = "14px sans-serif";
                        uiCtx.fillStyle = "#ef4444";
                        uiCtx.textAlign = "center";
                        uiCtx.textBaseline = "bottom";
                        uiCtx.fillText(`${distMeters.toFixed(2)} m`, midX, midY - 5);
                    }
                }
                
            } else if (currentMode === 'area' && areaPoints.length > 0) {
                drawAreaPreview(effectivePos);
            }
        });

        uiCanvas.addEventListener('mouseup', (e) => {
            if (e.button === 2) return;

            if (currentMode === 'select' && draggingTextIndex !== -1) {
                draggingTextIndex = -1;
                return;
            }

            if (isDrawing && startPoint) {
                const pos = getMousePos(e);
                const effectivePos = snappedPoint || pos;
                let endPos = snappedPoint ? snappedPoint : applyConstraints(startPoint, effectivePos, e);

                if (currentMode === 'measure') {
                    const distPix = Math.hypot(endPos.x - startPoint.x, endPos.y - startPoint.y);
                    const distMeters = (distPix / PIXELS_PER_MM) * (scale / 1000);
                    infoBar.innerText = `距離: ${distMeters.toFixed(2)} m （計測完了）`;
                } else {
                    if (Math.hypot(endPos.x - startPoint.x, endPos.y - startPoint.y) > 2) {
                        saveState();
                        lines.push({ start: startPoint, end: endPos, type: currentMode });
                    }
                }
                
                isDrawing = false;
                startPoint = null;
                redrawAll();
                uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
            }
        });

        // 面積計測の確定（右クリック）
        uiCanvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (currentMode === 'area' && areaPoints.length >= 3) {
                let areaPx = 0;
                for(let i = 0; i < areaPoints.length; i++) {
                    let j = (i + 1) % areaPoints.length;
                    areaPx += (areaPoints[i].x * areaPoints[j].y) - (areaPoints[j].x * areaPoints[i].y);
                }
                areaPx = Math.abs(areaPx) / 2.0;

                const areaSqMm = areaPx / (PIXELS_PER_MM * PIXELS_PER_MM);
                const areaSqMeters = areaSqMm * (scale / 1000) * (scale / 1000);
                
                infoBar.innerText = `面積計測結果: ${areaSqMeters.toFixed(2)} m2 （テキスト挿入モードで図面に書き込めます）`;
                
                areaPoints = []; // リセット
                redrawAll();
                uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
            } else if (currentMode === 'area') {
                infoBar.innerText = "面積を計算するには3点以上クリックしてください";
            }
        });

        function drawAreaPreview(currentMousePos) {
            if(areaPoints.length === 0) return;
            uiCtx.beginPath();
            uiCtx.moveTo(areaPoints[0].x, areaPoints[0].y);
            for(let i = 1; i < areaPoints.length; i++) {
                uiCtx.lineTo(areaPoints[i].x, areaPoints[i].y);
            }
            uiCtx.lineTo(currentMousePos.x, currentMousePos.y);
            uiCtx.lineTo(areaPoints[0].x, areaPoints[0].y);
            uiCtx.fillStyle = 'rgba(59, 130, 246, 0.2)'; 
            uiCtx.fill();
            uiCtx.strokeStyle = '#3b82f6';
            uiCtx.setLineDash([5, 5]);
            uiCtx.stroke();
            uiCtx.setLineDash([]);
        }

        function redrawAll() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            
            lines.forEach(line => {
                drawCtx.beginPath();
                drawCtx.moveTo(line.start.x, line.start.y);
                drawCtx.lineTo(line.end.x, line.end.y);
                drawCtx.setLineDash(line.type === 'dashed' ? [10, 10] : []);
                drawCtx.strokeStyle = '#000000';
                drawCtx.lineWidth = 2;
                drawCtx.stroke();
            });

            drawCtx.font = "16px sans-serif";
            drawCtx.fillStyle = "#000000";
            drawCtx.textAlign = "center";
            drawCtx.textBaseline = "middle";
            texts.forEach(t => {
                drawCtx.fillText(t.text, t.x, t.y);
            });
        }

        // PDF出力
        window.jsPDF = window.jspdf.jsPDF;
        async function exportPDF() {
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
            
            const inputs = document.querySelectorAll('#legend-box input');
            const replacements = [];
            inputs.forEach(input => {
                const span = document.createElement('span');
                span.innerText = input.value;
                span.style.fontSize = '12px';
                span.style.display = 'block';
                input.parentNode.insertBefore(span, input);
                input.style.display = 'none';
                replacements.push({input, span});
            });

            const canvasEl = document.getElementById('canvas-container');
            const canvas = await html2canvas(canvasEl, { scale: 2 });
            
            replacements.forEach(r => {
                r.input.style.display = '';
                r.span.remove();
            });

            const imgData = canvas.toDataURL('image/png');
            const pdf = new jsPDF({ orientation: 'landscape', format: 'a4' });
            pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
            pdf.save('横断面図.pdf');
        }

        // DXF出力 
        function exportDXF() {
            let dxf = `0\nSECTION\n2\nENTITIES\n`;
            lines.forEach(line => {
                const y1 = -line.start.y;
                const y2 = -line.end.y;
                const lineType = line.type === 'dashed' ? 'DASHED' : 'CONTINUOUS';
                dxf += `0\nLINE\n8\n0\n6\n${lineType}\n10\n${line.start.x}\n20\n${y1}\n30\n0.0\n11\n${line.end.x}\n21\n${y2}\n31\n0.0\n`;
            });
            texts.forEach(t => {
                dxf += `0\nTEXT\n8\n0\n10\n${t.x}\n20\n${-t.y}\n40\n14\n1\n${t.text}\n`;
            });
            dxf += `0\nENDSEC\n0\nEOF\n`;
            
            const blob = new Blob([dxf], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '横断面図.dxf';
            link.click();
        }

        // DXF読込 
        function importDXF(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const linesArr = text.split(/\r?\n/);
                let currentEntity = null;
                
                saveState();

                for(let i=0; i<linesArr.length; i+=2) {
                    const code = linesArr[i].trim();
                    const value = linesArr[i+1] ? linesArr[i+1].trim() : '';
                    
                    if (code === '0') {
                        if (currentEntity) {
                            if (currentEntity.type === 'text' && currentEntity.text) {
                                texts.push({ text: currentEntity.text, x: currentEntity.x, y: currentEntity.y });
                            } else if (currentEntity.start && currentEntity.start.x !== undefined && currentEntity.end.x !== undefined) {
                                lines.push(currentEntity);
                            }
                            currentEntity = null;
                        }
                        
                        if (value === 'LINE') {
                            currentEntity = { start:{}, end:{}, type: 'solid' };
                        } else if (value === 'TEXT') {
                            currentEntity = { type: 'text' };
                        }
                    } else if (currentEntity) {
                        if (currentEntity.type === 'text') {
                            if (code === '10') currentEntity.x = parseFloat(value);
                            if (code === '20') currentEntity.y = -parseFloat(value);
                            if (code === '1') currentEntity.text = value;
                        } else {
                            if (code === '10') currentEntity.start.x = parseFloat(value);
                            if (code === '20') currentEntity.start.y = -parseFloat(value);
                            if (code === '11') currentEntity.end.x = parseFloat(value);
                            if (code === '21') currentEntity.end.y = -parseFloat(value);
                            if (code === '6' && value.includes('DASH')) currentEntity.type = 'dashed';
                        }
                    }
                }
                redrawAll();
                document.getElementById('dxf-import').value = "";
            };
            reader.readAsText(file);
        }
        
        updateScaleBar();
    </script>
</body>
